services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apptrack
      POSTGRES_PASSWORD: apptrack
      POSTGRES_DB: apptrack
    ports:
      - "5432:5432"
    volumes:
      - apptrack_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  apptrack_pg:
