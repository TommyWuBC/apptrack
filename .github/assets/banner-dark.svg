<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="apptrack: your inbox, turned into an auditable application timeline">
  <rect width="1280" height="360" fill="#15171c"/>
  <rect x="24.5" y="24.5" width="1231" height="311" fill="none" stroke="#2c3039"/>
  <text x="80" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.5" fill="#9a958b">TOMMYWUBC / APPTRACK</text>
  <line x1="80" y1="124" x2="140" y2="124" stroke="#8fb0e8" stroke-width="2"/>
  <text x="78" y="200" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="70" fill="#ece8e1">apptrack</text>
  <text x="80" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9a958b">Your inbox, turned into an auditable application timeline.</text>
  <text x="80" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#9a958b">GMAIL READONLY · DETERMINISTIC-FIRST · EVENT-SOURCED · SELF-HOSTED</text>

  <!-- email → event → state -->
  <g transform="translate(830 0)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- envelopes: one per event -->
    <g fill="#15171c" stroke="#ece8e1" stroke-width="1.5" stroke-linejoin="round">
      <rect x="12" y="92" width="36" height="24"/>
      <path d="M12 92 L30 106 L48 92" fill="none"/>
      <rect x="112" y="92" width="36" height="24"/>
      <path d="M112 92 L130 106 L148 92" fill="none"/>
      <rect x="212" y="92" width="36" height="24" fill="#1d2027" stroke="#8fb0e8"/>
      <path d="M212 92 L230 106 L248 92" fill="none" stroke="#8fb0e8"/>
    </g>
    <!-- the email that never arrives -->
    <g fill="none" stroke="#c8553d" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85">
      <rect x="342" y="92" width="36" height="24"/>
      <path d="M342 92 L360 106 L378 92"/>
    </g>

    <!-- drop lines: email → event -->
    <g stroke="#9a958b" stroke-width="1" stroke-dasharray="2 4">
      <line x1="30" y1="122" x2="30" y2="176"/>
      <line x1="130" y1="122" x2="130" y2="176"/>
      <line x1="230" y1="122" x2="230" y2="174"/>
    </g>

    <!-- timeline -->
    <line x1="0" y1="186" x2="230" y2="186" stroke="#ece8e1" stroke-width="1.5"/>
    <line x1="230" y1="186" x2="352" y2="186" stroke="#c8553d" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="30" cy="186" r="6" fill="#15171c" stroke="#ece8e1" stroke-width="1.5"/>
    <circle cx="130" cy="186" r="6" fill="#15171c" stroke="#ece8e1" stroke-width="1.5"/>
    <circle cx="230" cy="186" r="7" fill="#8fb0e8"/>
    <circle cx="230" cy="186" r="13" fill="none" stroke="#8fb0e8" stroke-width="1"/>
    <circle cx="360" cy="186" r="8" fill="#15171c" stroke="#c8553d" stroke-width="1.5" stroke-dasharray="3 3"/>

    <g font-size="11" letter-spacing="1.2" fill="#9a958b">
      <text x="30" y="220" text-anchor="middle">CONFIRMED</text>
      <text x="130" y="220" text-anchor="middle">OA</text>
      <text x="230" y="220" text-anchor="middle" fill="#8fb0e8">INTERVIEW</text>
      <text x="360" y="220" text-anchor="middle" fill="#c8553d">GHOSTED?</text>
      <text x="295" y="176" text-anchor="middle" font-size="10" fill="#c8553d">60 DAYS</text>
    </g>

    <!-- caption rule -->
    <line x1="0" y1="258" x2="380" y2="258" stroke="#2c3039"/>
    <text x="0" y="282" font-size="11" letter-spacing="1.5" fill="#9a958b">EMAIL → EVENT → STATE</text>
    <text x="380" y="282" font-size="11" letter-spacing="1.5" fill="#9a958b" text-anchor="end">SILENCE → INFERENCE</text>
  </g>
</svg>
