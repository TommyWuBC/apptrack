name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Boundaries
        run: pnpm boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Analytics SDK e2e
        run: |
          pnpm --filter @apptrack/analytics-sdk build
          pnpm --filter @apptrack/example-website-astro exec playwright install chromium
          pnpm e2e:sdk

      - name: Fixture corpus
        run: pnpm test:fixtures

      - name: Packaging artifacts
        run: pnpm test:packaging

      - name: Eval harness
        run: pnpm eval

      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
